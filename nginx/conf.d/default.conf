# ═══════════════════════════════════════════════════════════
# Default server — Vubon.com.bd reverse proxy routes
# ═══════════════════════════════════════════════════════════

# ─── Redirect HTTP to HTTPS (production) ───
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vubon.com.bd www.vubon.com.bd;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # For now: serve directly (add SSL later via certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main API Gateway (HTTP fallback for dev) ───
server {
    listen 8080 default_server;
    server_name _;

    # Health
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ─── Identity ───
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://identity_svc;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/v1/users/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://identity_svc;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/v1/public/profiles/ {
        proxy_pass http://identity_svc;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ─── Product ───
    location /api/products/ {
        proxy_pass http://product_svc/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/categories/ {
        proxy_pass http://product_svc/categories/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/brands/ {
        proxy_pass http://product_svc/brands/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/product-variants/ {
        proxy_pass http://product_svc/product-variants/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/product-inventory/ {
        proxy_pass http://product_svc/product-inventory/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/public/products/ {
        proxy_pass http://product_svc/public/products/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ─── Vendor ───
    location /api/vendors/ {
        proxy_pass http://vendor_svc/vendors/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/public/vendors/ {
        proxy_pass http://vendor_svc/public/vendors/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ─── Cart ───
    location /api/carts/ {
        proxy_pass http://cart_svc/carts/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ─── Order ───
    location /api/orders/ {
        proxy_pass http://order_svc/orders/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/checkouts/ {
        proxy_pass http://order_svc/checkouts/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ─── Payment ───
    location /api/payments/ {
        proxy_pass http://payment_svc/payments/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
    location /api/refunds/ {
        proxy_pass http://payment_svc/refunds/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }

    # ─── Notification (internal/admin) ───
    location /api/notifications/ {
        proxy_pass http://notification_svc/notifications/;
        include /etc/nginx/conf.d/_proxy_headers.conf;
    }
}
