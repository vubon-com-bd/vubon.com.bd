# ═══════════════════════════════════════════════════════════
# Vubon.com.bd — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstreams
    upstream identity_svc {
        server identity:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream product_svc {
        server product:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream vendor_svc {
        server vendor:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream cart_svc {
        server cart:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream order_svc {
        server order:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream payment_svc {
        server payment:3006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream notification_svc {
        server notification:4006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
