# ═══════════════════════════════════════════════════════════════
# Notification Service — Nixpacks config
# ═══════════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm", "openssl"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @vubon/shared-kernel build",
  "pnpm --filter @vubon/notification-service build",
]

[start]
cmd = "node apps/notification-service/dist/main.js"

[variables]
NODE_ENV = "production"
PERSISTENCE_DRIVER = "prisma"
