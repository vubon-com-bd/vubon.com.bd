[build]
builder = "nixpacks"
buildCommand = "pnpm --filter @vubon/notification-service build"

[deploy]
startCommand = "node apps/notification-service/dist/main.js"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
