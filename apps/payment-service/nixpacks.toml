[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @vubon/shared-kernel build",
  "pnpm --filter @vubon/payment-service build",
]

[start]
cmd = "node apps/payment-service/dist/main.js"

[variables]
NODE_ENV = "production"
DB_MODE = "prisma"
