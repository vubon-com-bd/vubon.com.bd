# ═══════════════════════════════════════════════════════════════
# Railway deployment configuration for user-service
# ═══════════════════════════════════════════════════════════════

[build]
builder          = "DOCKERFILE"
dockerfilePath   = "apps/user-service/Dockerfile"
watchPatterns    = ["apps/user-service/**", "packages/**"]

[deploy]
startCommand      = "node dist/main.js"
healthcheckPath   = "/api/v1/docs-json"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
name = "user-service"
