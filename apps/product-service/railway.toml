# ═══════════════════════════════════════════════════════════════
# Railway deployment configuration for product-service
# ═══════════════════════════════════════════════════════════════

[build]
builder          = "DOCKERFILE"
dockerfilePath   = "apps/product-service/Dockerfile"
watchPatterns    = ["apps/product-service/**", "packages/**"]

[deploy]
startCommand      = "node dist/main.js"
healthcheckPath   = "/api/v1/docs-json"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
name = "product-service"
