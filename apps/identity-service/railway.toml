# ═══════════════════════════════════════════════════════════════
# Railway deployment configuration for auth-service
# ═══════════════════════════════════════════════════════════════

[build]
builder          = "DOCKERFILE"
dockerfilePath   = "apps/auth-service/Dockerfile"
watchPatterns    = ["apps/auth-service/**", "packages/**"]

[deploy]
startCommand       = "node dist/main.js"
healthcheckPath    = "/api/docs-json"
healthcheckTimeout = 60
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
name = "auth-service"
