# ═══════════════════════════════════════════════════════════════
# Railway deployment configuration for cart-service
# ═══════════════════════════════════════════════════════════════

[build]
builder          = "DOCKERFILE"
dockerfilePath   = "apps/cart-service/Dockerfile"
watchPatterns    = ["apps/cart-service/**", "packages/**"]

[deploy]
startCommand        = "node dist/main.js"
healthcheckPath     = "/api/v1/health"
healthcheckTimeout  = 60
restartPolicyType   = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
name = "cart-service"
