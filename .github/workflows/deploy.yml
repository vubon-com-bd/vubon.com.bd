# ═══════════════════════════════════════════════════════════════
# Deploy — GitHub Actions → Railway
# ═══════════════════════════════════════════════════════════════
# Optional pipeline.
#
# Railway auto-deploys every push to `main` when the repo is connected
# in the Railway dashboard. Use this workflow only if you prefer to
# drive deploys explicitly from GitHub Actions.
#
# Each service is deployed to its own Railway service (matched by name).
# To add a new service, append an entry to the matrix below.
# ═══════════════════════════════════════════════════════════════

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Railway service name to deploy (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  detect:
    name: 🔍 Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build service matrix
        id: matrix
        run: |
          # All apps/* folders are candidate services.
          # Filter to those that have a `railway.toml` or `Dockerfile`.
          SERVICES=$(find apps -maxdepth 2 -type f \
            \( -name railway.toml -o -name Dockerfile \) \
            -printf '%h\n' 2>/dev/null \
            | sed 's|^apps/||' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Detected services: $SERVICES"

  deploy:
    name: 🚀 Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "⚠️  RAILWAY_TOKEN not set — skipping deploy for ${{ matrix.service }}"
            echo "(Railway auto-deploys on push to main by default)"
            exit 0
          fi
          echo "🚀 Deploying ${{ matrix.service }}..."
          railway up --service "${{ matrix.service }}" --detach

  summary:
    name: ✅ Deploy Summary
    runs-on: ubuntu-latest
    needs: [detect, deploy]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "📦 Detected services: ${{ needs.detect.outputs.services }}"
          echo "🚀 Deploy result:      ${{ needs.deploy.result }}"
