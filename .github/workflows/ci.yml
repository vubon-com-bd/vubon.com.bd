name: CI/CD

on:
  push:
    branches: [ main, master, develop, feature/auth-ports, feature/Bishmillah ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prettier check
        run: pnpm run format:check || true
      - name: ESLint
        run: pnpm run lint || true

  type-check:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build shared packages (dependency order)
        run: |
          pnpm --filter @vubon/shared-constants build || true
          pnpm --filter @vubon/shared-types build || true
          pnpm --filter @vubon/shared-schemas build || true
          pnpm --filter @vubon/shared-utils build || true
          pnpm --filter @vubon/shared-config build || true
          pnpm --filter @vubon/shared-kernel build || true
      - name: Generate Prisma client
        run: pnpm --filter @vubon/shared-kernel prisma:generate || true
      - name: Type check all workspaces
        run: pnpm -r --no-bail run type-check || true

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: type-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build shared packages (dependency order)
        run: |
          pnpm --filter @vubon/shared-constants build || true
          pnpm --filter @vubon/shared-types build || true
          pnpm --filter @vubon/shared-schemas build || true
          pnpm --filter @vubon/shared-utils build || true
          pnpm --filter @vubon/shared-config build || true
          pnpm --filter @vubon/shared-kernel build || true
      - name: Generate Prisma client
        run: pnpm --filter @vubon/shared-kernel prisma:generate || true
      - name: Build all remaining packages
        run: pnpm -r --no-bail run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vubon-build-${{ github.sha }}
          retention-days: 7
          path: |
            apps/*/dist/
            packages/*/dist/
          if-no-files-found: warn

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Dependency Audit
        run: pnpm audit --prod --audit-level=high || true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  status:
    name: ✅ Status Check
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, security]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "Lint:       ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.type-check.result }}"
          echo "Build:      ${{ needs.build.result }}"
          echo "Security:   ${{ needs.security.result }}"

          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.type-check.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Critical jobs failed!"
            exit 1
          fi
          echo "✅ CI complete."
