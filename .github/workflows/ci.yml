name: CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
                                                                   jobs:
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest                                             timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check                                           run: pnpm run format:check || true
                                                                         - name: Run ESLint
        run: pnpm run lint || true

  type-check:
    name: 🔍 Type Check                                                runs-on: ubuntu-latest                                             timeout-minutes: 15
    needs: lint
    steps:                                                               - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:                                                                version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4                                        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'                                            
      - name: Install dependencies
        run: pnpm install --frozen-lockfile                        
      - name: Build shared packages first                                  run: |
          pnpm --filter @vubon/shared-constants build                        pnpm --filter @vubon/shared-types build
          pnpm --filter @vubon/shared-schemas build
          pnpm --filter @vubon/shared-utils build                            pnpm --filter @vubon/shared-config build

      - name: Run TypeScript type check                                    run: pnpm --filter @vubon/backend-service type-check

  build:                                                               name: 🏗️ Build
    runs-on: ubuntu-latest                                             timeout-minutes: 20
    needs: type-check                                                  steps:
      - name: Checkout Repository
        uses: actions/checkout@v4                                  
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:                                                                version: 8
                                                                         - name: Setup Node.js
        uses: actions/setup-node@v4                                        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
                                                                         - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages                                           run: |                                                               pnpm --filter @vubon/shared-constants build
          pnpm --filter @vubon/shared-types build
          pnpm --filter @vubon/shared-schemas build                          pnpm --filter @vubon/shared-utils build
          pnpm --filter @vubon/shared-config build
          pnpm --filter @vubon/backend-service build
                                                                         - name: Upload Build Artifacts                                       uses: actions/upload-artifact@v4
        with:
          name: vubon-build-${{ github.sha }}                                retention-days: 7
          path: |
            packages/**/dist
            package.json                                                       pnpm-lock.yaml

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build                                                       steps:
      - name: Checkout Repository
        uses: actions/checkout@v4                                  
      - name: Setup pnpm                                                   uses: pnpm/action-setup@v2
        with:
          version: 8                                                                                                                        - name: Setup Node.js
        uses: actions/setup-node@v4
        with:                                                                node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile                        
      - name: Run tests                                                    run: pnpm --filter @vubon/backend-service test || true

  security:
    name: 🔒 Security Scan                                             runs-on: ubuntu-latest                                             timeout-minutes: 20
    needs: build                                                       steps:
      - name: Checkout Repository
        uses: actions/checkout@v4                                                                                                           - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:                                                                version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4                                        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'                                            
      - name: Install dependencies                                         run: pnpm install --frozen-lockfile

      - name: Dependency Audit
        run: pnpm audit --prod --audit-level=high || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript                         
      - name: Autobuild                                                    uses: github/codeql-action/autobuild@v3

      - name: CodeQL Analysis                                              uses: github/codeql-action/analyze@v3

  status:
    name: ✅ Status Check
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, test, security]
    if: always()
    steps:
      - name: Check status                                                 run: |
          echo "✅ Lint: ${{ needs.lint.result }}"
          echo "✅ Type Check: ${{ needs.type-check.result }}"               echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Test: ${{ needs.test.result }}"
          echo "✅ Security: ${{ needs.security.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Some checks failed!"
