name: Test and Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @vubon/auth-shared-constants build
          pnpm --filter @vubon/auth-shared-types build
          pnpm --filter @vubon/auth-shared-utils build
          pnpm --filter @vubon/auth-shared-api build
          pnpm --filter @vubon/auth-shared-auth build
          pnpm --filter @vubon/auth-shared-hooks build
          pnpm --filter @vubon/shared-ui build

      - name: Copy shared packages
        run: |
          mkdir -p apps/customer-dashboard/auth/node_modules/@vubon
          cp -r packages/auth/shared-constants/dist apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-constants
          cp -r packages/auth/shared-types/dist apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-types
          cp -r packages/auth/shared-utils/dist apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-utils
          cp -r packages/auth/shared-api/dist apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-api
          cp -r packages/auth/shared-auth/dist apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-auth
          cp -r packages/auth/shared-hooks/dist apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-hooks
          cp -r packages/shared-ui/dist apps/customer-dashboard/auth/node_modules/@vubon/shared-ui
          cp packages/auth/shared-auth/package.json apps/customer-dashboard/auth/node_modules/@vubon/auth-shared-auth/

      - name: Run Full Code Validation
        run: pnpm run check
        env:
          NODE_ENV: test

      - name: Build Workspace
        run: pnpm -r run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: vubon-build
          retention-days: 7
          path: |
            apps/**/.next
            apps/**/dist
            packages/**/dist
            package.json
            pnpm-lock.yaml
