name: Vubon Monorepo CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  ci:
    name: CI - Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages in correct order
        run: |
          echo "🔨 Building shared-constants..."
          pnpm --filter @vubon/auth-shared-constants build
          
          echo "🔨 Building shared-types..."
          pnpm --filter @vubon/auth-shared-types build
          
          echo "🔨 Building shared-schemas..."
          pnpm --filter @vubon/auth-shared-schemas build
          
          echo "🔨 Building shared-utils..."
          pnpm --filter @vubon/auth-shared-utils build
          
          echo "🔨 Building shared-config..."
          pnpm --filter @vubon/auth-shared-config build
          
          echo "🔨 Building shared-api..."
          pnpm --filter @vubon/auth-shared-api build
          
          echo "🔨 Building shared-auth..."
          pnpm --filter @vubon/auth-shared-auth build
          
          echo "🔨 Building shared-hooks..."
          pnpm --filter @vubon/auth-shared-hooks build
          
          echo "🔨 Building shared-ui..."
          pnpm --filter @vubon/shared-ui build

      - name: Build all packages
        run: pnpm -r run build

      - name: Run Full Code Validation
        run: pnpm run check
        env:
          NODE_ENV: test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: vubon-build
          retention-days: 7
          path: |
            apps/**/.next
            apps/**/dist
            packages/**/dist
            package.json
            pnpm-lock.yaml
