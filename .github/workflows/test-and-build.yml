name: Vubon Monorepo CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:

# =====================================================
# 1. QUALITY CHECK & BUILD
# =====================================================
  ci:
    name: CI - Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vubon/auth-service prisma generate || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Full Code Validation
        run: pnpm run check
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build Workspace
        run: pnpm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: vubon-build
          retention-days: 7
          path: |
            apps/**/.next
            apps/**/dist
            packages/**/dist
            package.json
            pnpm-lock.yaml

# =====================================================
# 2. SECURITY SCAN (CodeQL & Audit)
# =====================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit
        run: pnpm audit --prod --audit-level=high || true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4

# =====================================================
# 3. STAGING DEPLOYMENT
# =====================================================
  deploy-staging:
    name: Deploy Staging
    needs: [ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.vubon.com.bd

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: vubon-build

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install Production Dependencies
        run: |
          pnpm install --frozen-lockfile --prod
          pnpm --filter @vubon/auth-service prisma generate || true
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Database Migration
        run: pnpm --filter @vubon/auth-service prisma migrate deploy || true
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deploy Staging
        run: echo "Deploying to staging server..."

# =====================================================
# 4. PRODUCTION DEPLOYMENT
# =====================================================
  deploy-production:
    name: Deploy Production
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vubon.com.bd

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: vubon-build

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install Production Dependencies
        run: |
          pnpm install --frozen-lockfile --prod
          pnpm --filter @vubon/auth-service prisma generate || true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Production Migration
        run: pnpm --filter @vubon/auth-service prisma migrate deploy || true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy Production
        run: echo "Deploying Vubon Production..."
