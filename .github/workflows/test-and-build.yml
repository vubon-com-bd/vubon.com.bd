name: Test and Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build All Shared Packages
        run: |
          pnpm --filter @vubon/auth-shared-constants build
          pnpm --filter @vubon/auth-shared-types build
          pnpm --filter @vubon/auth-shared-utils build
          pnpm --filter @vubon/auth-shared-api build
          pnpm --filter @vubon/auth-shared-auth build
          pnpm --filter @vubon/auth-shared-hooks build
          pnpm --filter @vubon/shared-ui build

      - name: Fix tsconfig.json for CI
        run: |
          cat > apps/customer-dashboard/auth/tsconfig.json << 'TS_CONFIG'
          {
            "extends": "../../../tsconfig.base.json",
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["DOM", "DOM.Iterable", "ES2022"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "ESNext",
              "moduleResolution": "node",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve",
              "incremental": true,
              "plugins": [{ "name": "next" }],
              "baseUrl": ".",
              "paths": {
                "@/*": ["./src/*"],
                "@vubon/auth-shared-constants": ["../../packages/auth/shared-constants/src"],
                "@vubon/auth-shared-types": ["../../packages/auth/shared-types/src"],
                "@vubon/auth-shared-utils": ["../../packages/auth/shared-utils/src"],
                "@vubon/auth-shared-api": ["../../packages/auth/shared-api/src"],
                "@vubon/auth-shared-auth": ["../../packages/auth/shared-auth/src"],
                "@vubon/auth-shared-hooks": ["../../packages/auth/shared-hooks/src"],
                "@vubon/shared-ui": ["../../packages/shared-ui/src"]
              }
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
            "exclude": ["node_modules", "dist", ".next"]
          }
          TS_CONFIG

      - name: Run Full Code Validation
        run: pnpm run check
        env:
          NODE_ENV: test

      - name: Build Workspace
        run: pnpm -r run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: vubon-build
          retention-days: 7
          path: |
            apps/**/.next
            apps/**/dist
            packages/**/dist
            package.json
            pnpm-lock.yaml
