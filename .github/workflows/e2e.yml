name: E2E Tests

on:
  push:
    branches: [ main, master, develop, feature/auth-ports, feature/Bishmillah ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  e2e-tests:
    name: 🎭 E2E Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - auth-service
          - product-service
          - cart-service
          - order-service
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/vubon_test
      JWT_SECRET: ci-e2e-secret-min-32-chars-please-change-in-prod
      JWT_ISSUER: vubon-api
      JWT_AUDIENCE: vubon-client
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: "vubon:e2e:"
      REDIS_DB: 0
      LOG_LEVEL: error
      USE_IN_MEMORY_REPOS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages (dependency order)
        run: |
          pnpm --filter @vubon/shared-constants build || true
          pnpm --filter @vubon/shared-types build || true
          pnpm --filter @vubon/shared-schemas build || true
          pnpm --filter @vubon/shared-utils build || true
          pnpm --filter @vubon/shared-config build || true
          pnpm --filter @vubon/shared-kernel build || true

      - name: Generate Prisma client
        run: pnpm --filter @vubon/shared-kernel prisma:generate || true

      - name: Run E2E tests for ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: pnpm test:e2e -- --json --outputFile=./e2e-results.json || true

      - name: 📊 Generate E2E failure summary
        if: always()
        working-directory: apps/${{ matrix.service }}
        run: node ${{ github.workspace }}/.github/scripts/test-summary.cjs ./e2e-results.json ${{ matrix.service }}

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.service }}-${{ github.sha }}
          retention-days: 7
          path: |
            apps/${{ matrix.service }}/e2e-results.json
            apps/${{ matrix.service }}/coverage/
          if-no-files-found: ignore
