name: E2E Tests

on:
  push:
    branches: [ main, master, develop, feature/auth-ports, feature/Bishmillah ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  e2e-tests:
    name: 🎭 E2E Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - auth-service
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/vubon_test
      JWT_SECRET: ci-e2e-secret-min-32-chars-please-change-in-prod
      JWT_ISSUER: vubon-api
      JWT_AUDIENCE: vubon-client
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: "vubon:e2e:"
      REDIS_DB: 0
      LOG_LEVEL: error
      USE_IN_MEMORY_REPOS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages (dependency order)
        run: |
          pnpm --filter @vubon/shared-constants build || true
          pnpm --filter @vubon/shared-types build || true
          pnpm --filter @vubon/shared-schemas build || true
          pnpm --filter @vubon/shared-utils build || true
          pnpm --filter @vubon/shared-config build || true
          pnpm --filter @vubon/shared-kernel build || true

      - name: Generate Prisma client
        run: pnpm --filter @vubon/shared-kernel prisma:generate || true

      - name: Run E2E tests for ${{ matrix.service }}
        working-directory: apps/${{ matrix.service }}
        run: pnpm test:e2e -- --json --outputFile=./e2e-results.json || true

      - name: 📊 Generate E2E failure summary
        if: always()
        working-directory: apps/${{ matrix.service }}
        run: |
          echo "## 🎭 ${{ matrix.service }} — E2E Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f e2e-results.json ]; then
            echo "⚠️ No E2E results file found (test did not produce output)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          node -e "
            const r = require('./e2e-results.json');
            const failed = r.testResults.filter(t => t.status === 'failed');
            const passed = r.testResults.filter(t => t.status === 'passed');

            console.log('| Metric | Count |');
            console.log('|--------|-------|');
            console.log('| ✅ Passed Suites | ' + passed.length + ' |');
            console.log('| ❌ Failed Suites | ' + failed.length + ' |');
            console.log('');
            console.log('| Total E2E Tests | ' + r.numTotalTests + ' |');
            console.log('| Passed | ' + r.numPassedTests + ' |');
            console.log('| Failed | ' + r.numFailedTests + ' |');
            console.log('');

            if (failed.length > 0) {
              console.log('### ❌ Failed E2E Files');
              console.log('');
              failed.forEach(t => {
                const shortName = t.name.replace(process.cwd(), '').replace(/\\/g, '/');
                console.log('- \`' + shortName + '\`');
              });
              console.log('');
              console.log('### 🔍 Failure Details');
              console.log('');
              failed.forEach(t => {
                const shortName = t.name.replace(process.cwd(), '').replace(/\\/g, '/');
                console.log('<details>');
                console.log('<summary>❌ ' + shortName + '</summary>');
                console.log('');
                t.assertionResults
                  .filter(a => a.status === 'failed')
                  .forEach(a => {
                    console.log('**' + a.title + '**');
                    console.log('```');
                    console.log((a.failureMessages || []).join('\n').substring(0, 1000));
                    console.log('```');
                    console.log('');
                  });
                console.log('</details>');
                console.log('');
              });
            }
          " >> $GITHUB_STEP_SUMMARY

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.service }}-${{ github.sha }}
          retention-days: 7
          path: |
            apps/${{ matrix.service }}/e2e-results.json
            apps/${{ matrix.service }}/coverage/
          if-no-files-found: ignore
